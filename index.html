<script>
(function(){

  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+

  let html = ''
  for (const [gid, glabel] of Object.entries(groups)) {

function runJS(code) {
  openBottomPanel('console')
  try {
    const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor
    const fn = new AsyncFunction('console', code)
    fn(createConsoleProxy())
  } catch(e) {
    addConsole('error', e.message)
  }
}

async function runPython(code) {
  openBottomPanel('console')
  addConsole('sys', '?? Loading Pyodide (Python runtime)�')
  try {
    if (!window.loadPyodide) {
      const script = document.createElement('script')
      script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js'
      await new Promise((res, rej) => { script.onload = res; script.onerror = rej; document.head.appendChild(script) })
    }
    if (!window.__pyodide) {
      window.__pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' })
    }
    addConsole('sys', '? Python ready')
    let output = ''
    window.__pyodide.setStdout({ batched: s => { output += s + '\n' } })
    window.__pyodide.setStderr({ batched: s => addConsole('error', s) })
    await window.__pyodide.runPythonAsync(code)
    output.trim().split('\n').filter(Boolean).forEach(l => addConsole('log', l))
  } catch(e) {
    addConsole('error', String(e))
  }
}

function createConsoleProxy() {
  return {
    log:   (...a) => addConsole('log',  a.map(x => typeof x === 'object' ? JSON.stringify(x, null, 2) : String(x)).join(' ')),
    warn:  (...a) => addConsole('warn', a.join(' ')),
    error: (...a) => addConsole('error',a.join(' ')),
    info:  (...a) => addConsole('info', a.join(' ')),
    table: (d)    => addConsole('log',  JSON.stringify(d, null, 2)),
    time:  (l)    => addConsole('sys',  `? ${l} started`),
    timeEnd:(l)   => addConsole('sys',  `? ${l} ended`),
    clear: ()     => clearConsole(),
    group: (l)    => addConsole('sys',  `? ${l}`),
    groupEnd:()   => {},
  }
}

window.addEventListener('message', e => {
  if (e.data?.type !== 'console') return
  addConsole(e.data.level, e.data.msg)
})

const TERM_CMDS = {
  help: () => 'Available: help, clear, echo [text], date, time, ls, pwd, node -v, npm -v',
  clear: () => { document.getElementById('term-output').innerHTML = ''; return '' },
  date: () => new Date().toLocaleDateString(),

function handleTermInput(e) {
  if (e.key !== 'Enter') return
  const input = document.getElementById('term-input')
  const cmd = input.value.trim(); input.value = ''
  const out = document.getElementById('term-output')
  const line = document.createElement('div'); line.className = 'cl log'
  line.innerHTML = `<span class="cl-icon" style="color:var(--green)">$</span><span class="cl-msg">${escHTML(cmd)}</span>`
  out.appendChild(line)
  if (!cmd) return
  let result
  if (cmd.startsWith('echo ')) result = cmd.slice(5)
  else result = TERM_CMDS[cmd]?.() ?? `Command not found: ${cmd}. Type 'help' for available commands.`
  if (result) {
    const res = document.createElement('div'); res.className = 'cl sys'
    res.innerHTML = `<span class="cl-icon">�</span><span class="cl-msg">${escHTML(result)}</span>`
    out.appendChild(res)
  }
  out.scrollTop = out.scrollHeight
}

async function sendAI() {
  const key = document.getElementById('ai-key').value.trim()
  if (!key) { toast('Enter your OpenAI API key first', 'err'); return }
  const input = document.getElementById('ai-input')
  const q = input.value.trim(); if (!q) return
  input.value = ''

  const code = editor?.getValue() || ''
  const lang = getLang(currentLangId).label
  addAIMsg('user', q)

  const systemPrompt = `You are an expert ${lang} programmer and coding assistant in Universe IDE. When showing code, use markdown code blocks. Be concise but thorough. Current code context:\n\`\`\`${lang}\n${code.slice(0,2000)}\n\`\`\``

  try {
    document.getElementById('ai-send-btn').disabled = true
    const msgs = [{ role:'system', content: systemPrompt }, ...aiMessages.slice(-10), { role:'user', content: q }]
    const model = document.getElementById('ai-model').value

    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({ model, messages: msgs, max_tokens: 1500, temperature: 0.7 })
    })
    if (!resp.ok) throw new Error(`API error ${resp.status}`)
    const data = await resp.json()
    const reply = data.choices[0].message.content
    addAIMsg('assistant', reply)
    aiMessages.push({ role:'user', content: q }, { role:'assistant', content: reply })
    document.getElementById('ai-badge').classList.add('connected')
    document.getElementById('ai-badge').textContent = '?? AI Active'
  } catch(e) {
    addAIMsg('assistant', `? Error: ${e.message}\n\nCheck your API key and make sure it has chat completions access.`)
  } finally {
    document.getElementById('ai-send-btn').disabled = false
  }
}

function addAIMsg(role, content) {
  const el = document.getElementById('ai-messages')
  const md = content.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escHTML(code.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,.3);padding:.1rem .25rem;border-radius:3px">$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>')
  const div = document.createElement('div')
  div.className = `ai-msg ${role}`
  div.innerHTML = md
  el.appendChild(div)
  el.scrollTop = el.scrollHeight
}

  renderCDNAdded()
  runCode()
  toast(`?? Added ${name} v${version}`, 'ok')
}

// -- INTERVIEW MODE ---------------------------------------
function newProblem(diff) {
  const all = diff ? PROBLEMS[diff] : Object.values(PROBLEMS).flat()
  const prob = all[Math.floor(Math.random() * all.length)]
  if (!prob) return
  document.getElementById('problem-display').innerHTML = `
    <div class="problem-card">
      <div class="prob-title">${prob.title}</div>
      <div class="prob-diff diff-${prob.difficulty.toLowerCase()}">${prob.difficulty}</div>
      <div class="prob-desc">${prob.desc}</div>
      <pre class="prob-example">${prob.example}</pre>
    </div>
    <button class="btn btn-acc btn-sm" style="width:100%;justify-content:center" onclick="loadProblemCode(\`${prob.starter?.replace(/`/g,'\\`')}\`)">Load Starter Code</button>`
}

function loadProblemCode(code) {
  if (!editor) return
  const file = files.find(f => f.id === activeFileId) || files[0]
  file.content = code; file.lang = 'js'
  if (file.id === activeFileId) {
    editor.setValue(code)
    monaco.editor.setModelLanguage(editor.getModel(), 'javascript')
  }
  toast('Starter code loaded', 'ok')
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval)
  const mins = parseInt(document.getElementById('timer-duration').value)
  timerSeconds = mins * 60
  document.getElementById('timer-badge').classList.add('active')
  updateTimerDisplay()
  timerInterval = setInterval(() => {
    timerSeconds--
    updateTimerDisplay()
    if (timerSeconds <= 0) { stopInterview(); toast('? Time is up!', 'err') }
    if (timerSeconds === 300) toast('?? 5 minutes remaining', 'info')
  }, 1000)
  toast(`Interview timer started: ${mins} min`, 'ok')
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0')
  const s = (timerSeconds % 60).toString().padStart(2, '0')
  document.getElementById('timer-display').textContent = `${m}:${s}`
  if (timerSeconds <= 60) document.getElementById('timer-badge').style.animation = 'blink .5s infinite'
}

function stopInterview() {
  clearInterval(timerInterval); timerInterval = null
  document.getElementById('timer-badge').classList.remove('active')
  document.getElementById('timer-badge').style.animation = ''
}

// -- FORMAT ------------------------------------------------
async function formatCode() {
  if (!editor || typeof prettier === 'undefined') { toast('Formatter loading�', 'err'); return }
  const parserMap = { html:'html', css:'css', js:'babel', ts:'babel', jsx:'babel', tsx:'babel', json:'json' }
  const parser = parserMap[currentLangId]
  if (!parser) { toast('Auto-format not available for this language', 'info'); return }
  try {
    const code = editor.getValue()
    const plugins = [prettierPlugins.babel, prettierPlugins.html, prettierPlugins.postcss].filter(Boolean)
    const formatted = await prettier.format(code, { parser, plugins, printWidth: 100, tabWidth: 2, singleQuote: true, semi: true })
    const pos = editor.getPosition()
    editor.setValue(formatted)
    editor.setPosition(pos)
    toast('Formatted ?', 'ok')
  } catch(e) { toast('Format error: ' + e.message.slice(0, 60), 'err') }
}

// -- COPY & SHARE ------------------------------------------
function copyCode() {
  navigator.clipboard.writeText(editor?.getValue() || '').then(() => toast('Code copied', 'ok'))
}

function shareCode() {
  const state = { lang: currentLangId, files: files.map(({ id, name, lang, content }) => ({ id, name, lang, content })) }
  const url = location.origin + location.pathname + '?s=' + btoa(encodeURIComponent(JSON.stringify(state)))
  navigator.clipboard.writeText(url).then(() => toast('Share URL copied!', 'ok'))
}

function loadFromURL() {
  const params = new URLSearchParams(location.search)
  const s = params.get('s') || params.get('code')
  if (!s) return
  try {
    const state = JSON.parse(decodeURIComponent(atob(s)))
    if (state.files) { files = state.files; currentLangId = state.lang || 'html'; switchFile(files[0].id) }
    else if (state.html) { files[0].content = state.html; switchFile(files[0].id) }
    toast('Shared code loaded', 'ok')
  } catch {}
}

// -- THEMES -----------------------------------------------
function openThemes() {
  document.getElementById('theme-grid').innerHTML = THEMES.map(t => `
    <div class="theme-swatch ${t.id === 'universe-dark' ? 'active' : ''}" 
      onclick="setTheme('${t.id}',this)" 
      style="background:${t.bg};color:${t.bg === '#ffffff' ? '#333' : '#ccc'}">
      ${t.label}
    </div>`).join('')
  document.getElementById('theme-overlay').classList.add('open')
}
function closeThemes() { document.getElementById('theme-overlay').classList.remove('open') }
function setTheme(id, el) {
  document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'))
  el.classList.add('active')
  monaco.editor.setTheme(id === 'universe-dark' ? 'universe-dark' : id)
  toast(`Theme: ${id}`, 'info')
}

// -- SNIPPETS ----------------------------------------------
function insertSnippet(name) {
  const code = SNIPPETS[name]; if (!code || !editor) return
  const isFullDoc = code.includes('<!DOCTYPE')
  if (isFullDoc) {
    const file = files.find(f => f.id === activeFileId)
    if (file) { file.content = code; file.lang = 'html' }
    editor.setValue(code)
    selectLang('html')
  } else {
    const pos = editor.getPosition()
    editor.executeEdits('', [{ range: new monaco.Range(pos.lineNumber, pos.column, pos.lineNumber, pos.column), text: '\n' + code + '\n' }])
  }
  runCode()
  toast(`Snippet inserted: ${name}`, 'ok')
}

// -- SIDEBAR -----------------------------------------------
function toggleLeftSidebar() {
  document.getElementById('left-sidebar').classList.toggle('collapsed')
  setTimeout(() => editor?.layout(), 300)
}

// -- STATUS BAR --------------------------------------------
function updateStatusBar() {
  const code = editor?.getValue() || ''
  document.getElementById('sb-words').textContent = `${code.length} chars`
}

// -- TOAST --------------------------------------------------
function toast(msg, type = '') {
  const el = document.createElement('div')
  el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg
  document.getElementById('toasts').appendChild(el)
  setTimeout(() => el.remove(), 2800)
}
</script>

<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>

      gaEvent('language_selected','Code IDE',this.value||this.textContent.trim());

  // Track run/execute actions
