<body>

<header class="topbar">
  <div class="logo"><span>⌨️</span> <a href="https://universeinvedors.tech/tools" style="color:inherit">Universe Tools</a> <span style="color:var(--muted);font-weight:400">/</span> <span>Code Playground</span></div>

  </div>

  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<script>
const DEFAULT = {
  html: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      text-align: center;
      max-width: 400px;
    }
    h1 { color: #60a5fa; margin: 0 0 0.5rem; }
    p  { color: #94a3b8; margin: 0; }
    button {
      margin-top: 1.25rem;
      padding: 0.6rem 1.5rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Universe!</h1>
    <p>Edit the code on the left to see changes here.</p>
    <button onclick="alert('It works!')">Click me</button>
  </div>
</body>
</html>`,
  css: '/* Add CSS here — it will be injected into the HTML */',
  js:  '// Add JavaScript here — it will be injected into the HTML'
}

let current = 'html'
let code = { html: DEFAULT.html, css: DEFAULT.css, js: DEFAULT.js }
let runTimer = null

const editor = document.getElementById('editor')
const preview = document.getElementById('preview')

editor.value = code[current]

function switchTab(tab, btn) {
  code[current] = editor.value
  current = tab
  editor.value = code[current]
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  btn.classList.add('active')
}

function buildDoc() {
  let h = code.html
  if (code.css.trim() && !code.css.startsWith('/*')) {
    h = h.replace('</head>', `<style>${code.css}</style></head>`)
  }
  if (code.js.trim() && !code.js.startsWith('//')) {
    h = h.replace('</body>', `<script>${code.js}<\/script></body>`)
  }
  return h
}

function runCode() {
  code[current] = editor.value
  preview.srcdoc = buildDoc()
}

function scheduleRun() {
  code[current] = editor.value
  clearTimeout(runTimer)
  runTimer = setTimeout(runCode, 600)
}

function copyCode() {
  navigator.clipboard.writeText(editor.value).then(() => {
    const btn = document.querySelector('.btn-copy')
    btn.textContent = 'Copied!'
    setTimeout(() => btn.textContent = 'Copy', 1500)
  })
}

function resetCode() {
  if (!confirm('Reset to default code?')) return
  code = { html: DEFAULT.html, css: DEFAULT.css, js: DEFAULT.js }
  editor.value = code[current]
  runCode()
}

// Initial run
runCode()

// Keyboard shortcut: Ctrl+Enter to run
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode() }
  // Tab indent
  if (e.key === 'Tab') {
    e.preventDefault()
    const s = editor.selectionStart
    editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(editor.selectionEnd)
    editor.selectionStart = editor.selectionEnd = s + 2
  }
})
</script>
</body>
